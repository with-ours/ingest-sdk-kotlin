name: CI
on: [push, pull_request]

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    timeout-minutes: 15
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            8
            21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run lints
        run: ./scripts/lint

  build:
    permissions:
      contents: read
    timeout-minutes: 15
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            8
            21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build SDK
        run: ./scripts/build

      - name: Verify documentation and publication artifacts
        run: ./gradlew publishAllPublicationsToLocalFileSystemRepository :dokkaGenerate -PpublishLocal

  test:
    permissions:
      contents: read
    timeout-minutes: 15
    name: test (Jackson ${{ matrix.jackson-version }})
    strategy:
      fail-fast: false
      matrix:
        jackson-version: ["2.14.0", "2.18.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            8
            21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run tests
        env:
          JACKSON_TEST_VERSION: ${{ matrix.jackson-version }}
        run: ./scripts/test -PjacksonTestVersion="$JACKSON_TEST_VERSION"
