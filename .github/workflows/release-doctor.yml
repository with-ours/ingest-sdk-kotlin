name: Release Doctor
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release_doctor:
    permissions:
      contents: read
    name: release doctor
    runs-on: ubuntu-latest
    if: github.repository == 'with-ours/ingest-sdk-kotlin' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please') || github.head_ref == 'next')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release environment
        run: |
          bash ./bin/check-release-environment
        env:
          SONATYPE_USERNAME: ${{ secrets.OURS_PRIVACY_SONATYPE_USERNAME || secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.OURS_PRIVACY_SONATYPE_PASSWORD || secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.OURS_PRIVACY_SONATYPE_GPG_SIGNING_KEY || secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.OURS_PRIVACY_SONATYPE_GPG_SIGNING_PASSWORD || secrets.GPG_SIGNING_PASSWORD }}
